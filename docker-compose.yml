name: adts-dev

# Uso local apenas (desenvolvimento). Em produção o Postgres e o Redis são
# os templates prontos do próprio EasyPanel — isso aqui não vai pra lá.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # adts_owner é dono das tabelas (migrations/seed). A API em runtime
      # NUNCA se conecta com esse usuário — ver RUNTIME_DATABASE_URL
      # (role adts_app, criada em docker/postgres/init.sql) no .env.
      POSTGRES_USER: adts_owner
      POSTGRES_PASSWORD: adts_owner
      POSTGRES_DB: adts
    ports:
      # 5434 no host — evita colidir com um Postgres já em uso na máquina
      # (ex.: outro projeto rodando na porta padrão 5432).
      - '5434:5432'
    volumes:
      - adts_postgres_data:/var/lib/postgresql/data
      # Só roda em um volume novo/vazio (primeira inicialização). Se o
      # volume já existe de uma versão anterior, recrie com
      # `docker compose down -v` antes de subir de novo.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - adts_redis_data:/data

  # Object storage (Sprint 2) — S3-compatible, substitui o MEDIA_ROOT em
  # disco local do Django original. Em produção (EasyPanel) é o template
  # de S3/MinIO deles; a API só muda via env (S3_ENDPOINT etc.), nunca
  # muda de código.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: adts_minio
      MINIO_ROOT_PASSWORD: adts_minio_secret
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # console web
    volumes:
      - adts_minio_data:/data

  # Cria o bucket padrão uma vez e sai — a própria API nunca precisa de
  # permissão pra criar bucket, só pra ler/escrever dentro de um que já
  # existe.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 adts_minio adts_minio_secret; do sleep 1; done;
      mc mb --ignore-existing local/adts-media;
      "

volumes:
  adts_postgres_data:
  adts_redis_data:
  adts_minio_data:
